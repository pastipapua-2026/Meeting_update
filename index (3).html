<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PASTI-Papua | Paparan Bulanan Zonal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
/* =========================================================
   TEMA: sama dengan PASTI-Papua Workspace v31 (gaya dashboard PTFI)
   Inter · oranye #e94e14 · tinta #182338 · kanvas #f4f6f9
   ========================================================= */
:root,[data-theme="light"]{
  --or:#e94e14; --or2:#FF8A5C; --or3:#FFD2BF; --or4:#fff1e9; --or-ink:#bd3a0b;
  --bg:#f4f6f9; --card:#FFFFFF; --soft:#f5f7fa; --line:#e2e7ee; --line2:#cfd7e2;
  --ink:#182338; --ink2:#2c3a52; --mut:#606d80; --faint:#94A3B8;
  --navy:#182338; --blue:#2F80ED; --blue-ink:#226bc5;
  --warn-soft:#fff4ec; --warn-ink:#c25a2c;
  --sh:0 3px 16px rgba(24,35,56,.04);
  --male:#2F80ED; --female:#e94e14;
  color-scheme:light;
}
[data-theme="dark"]{
  --bg:#101725; --card:#1a2435; --soft:#222e42; --line:#344157; --line2:#44526b;
  --ink:#f1f5fb; --ink2:#d5dcea; --mut:#b2bdd0; --faint:#7d8aa3;
  --or4:#2F160E; --or3:#6E280B; --or-ink:#ffae8d; --blue-ink:#91bdff;
  --warn-soft:rgba(255,138,92,.16); --warn-ink:#ffb08f;
  --sh:0 4px 20px rgba(0,0,0,.35);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--or);outline-offset:2px;border-radius:6px}

/* ---------- header (sama dengan .top workspace) ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);box-shadow:var(--sh)}
.top-in{max-width:1320px;margin:0 auto;padding:12px 24px;min-height:72px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{flex:1 1 300px;min-width:0;display:flex;align-items:center;gap:9px}
.hb-badge{flex:none;width:28px;height:28px;border-radius:6px;background:linear-gradient(135deg,#FF5515,#D03B00);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;font-size:14px;box-shadow:0 2px 6px rgba(255,85,21,.25)}
.ttl{min-width:0;line-height:1.2}
.brand h1{margin:0;font-size:16px;font-weight:700;letter-spacing:-.2px;color:var(--ink);white-space:nowrap}
.brand h1 span{font-weight:600;font-size:12px;color:var(--mut)}
.brand p{margin:2px 0 0;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctrl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fxs{display:flex;flex-direction:column;gap:3px;margin-right:6px}
.fxs label{font-size:11px;font-weight:700;color:var(--mut)}
.sel{-webkit-appearance:none;appearance:none;height:40px;border:1px solid var(--line);border-radius:8px;background-color:var(--card);color:var(--ink);padding:8px 30px 8px 10px;font-size:12.5px;font-weight:700;cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 14px) 50%,calc(100% - 10px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.sel:focus{outline:none;border-color:var(--or);box-shadow:0 0 0 2px rgba(255,85,21,.12)}
.tg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.tg button{border:0;background:transparent;width:40px;height:38px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.tg button.on{background:var(--ink);color:var(--card)}
.tg svg,.ibtn svg{width:19px;height:19px}
.ibtn{border:1px solid var(--line);background:var(--card);border-radius:8px;height:40px;min-width:40px;padding:0 10px;display:inline-flex;align-items:center;justify-content:center;gap:7px;color:var(--ink);font-size:12px;font-weight:700}
.ibtn:hover{background:var(--soft)}
.ibtn.pri{background:var(--or);border-color:var(--or);color:#fff}
.ibtn.pri:hover{opacity:.92;background:var(--or)}
/* navigasi bagian (gaya tombol nav workspace) */
.tabs{max-width:1320px;margin:0 auto;padding:0 18px 10px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;border:0;background:transparent;border-radius:8px;padding:8px 12px;display:flex;align-items:center;gap:8px;color:var(--ink);font-size:12.5px;font-weight:600;white-space:nowrap;min-height:38px}
.tab:hover{background:var(--soft)}
.tab .n{font-size:10.5px;color:var(--mut);font-weight:700}
.tab[aria-selected="true"]{background:var(--or4);color:var(--or);font-weight:800}
.tab[aria-selected="true"] .n{color:var(--or)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:0;height:3px;background:var(--or);border-radius:3px 3px 0 0}

/* ---------- layout ---------- */
main{max-width:1320px;margin:0 auto;padding:24px 24px 40px}
.page{display:none}.page.on{display:block}
.ph{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:16px}
.ph h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px}
.ph .sub{color:var(--mut);font-size:13px;margin-top:3px}
/* judul halaman = .pg-head workspace */
.ph.pg-head{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 24px;margin:0 0 20px;box-shadow:var(--sh);flex-wrap:nowrap}
.pg-l{display:flex;align-items:center;gap:14px;min-width:0}
.pg-num{font-size:24px;font-weight:800;color:var(--or);line-height:1;background:var(--or4);padding:10px;border-radius:10px;min-width:48px;text-align:center;flex:none}
.ph.pg-head h2{font-size:24px;letter-spacing:-.6px}
.src{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--mut);font-weight:600;white-space:nowrap}
.src i{width:7px;height:7px;border-radius:50%;background:var(--or)}
.src.sample i{background:var(--faint)}.src.draft i{background:var(--or2)}
.src.sample{color:var(--or)}
.stack-y>*+*{margin-top:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh);display:flex;flex-direction:column;min-width:0}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px 12px;padding:18px 18px 0;flex-wrap:wrap;min-height:50px}
.panel-h h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.2px}
.panel-h .meta{font-size:11px;color:var(--mut)}
.panel-b{padding:14px 18px 18px;flex:1;display:flex;flex-direction:column;min-width:0}
.row{display:grid;gap:16px;align-items:stretch}
.r-57{grid-template-columns:minmax(0,1fr) minmax(0,1.22fr)}
.r-11{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}

/* ---------- KPI (= .ek workspace) ---------- */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
.kpi{position:relative;padding:18px;min-height:174px;display:flex;flex-direction:column;gap:6px;overflow:hidden;box-shadow:0 2px 10px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.02)}
.kpi .lab{font-size:12px;font-weight:700;color:var(--mut);min-height:24px}
.kpi .val{font-size:32px;font-weight:800;letter-spacing:-1px;line-height:1.1;margin:8px 0 6px;white-space:nowrap}
.kpi .val small{font-size:14px;font-weight:600;color:var(--mut);letter-spacing:0}
.kpi .ctx{font-size:11px;color:var(--mut);line-height:1.6;margin-top:auto}
.kpi .ctx b{color:var(--ink)}
.kpi.lead{background:#182338;border-color:#182338;color:#fff;box-shadow:none}
.kpi.lead .lab,.kpi.lead .ctx,.kpi.lead .val small{color:#c0cad8}
.kpi.lead .ctx b,.kpi.lead .split b{color:#fff}
.kpi.lead .split{color:#c0cad8}
.kpi .ring{position:absolute;right:18px;top:18px}
.split{display:flex;gap:16px;font-size:11px;color:var(--mut);margin-top:auto;flex-wrap:wrap}
.split b{color:var(--ink);font-size:12px;font-weight:800}
.sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:0}

/* ---------- tabel (= .tw workspace) ---------- */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--ink);padding:10px 8px;border-bottom:2px solid var(--line);white-space:nowrap;background:var(--card)}
td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.5}
td.r,th.r{text-align:right;white-space:nowrap}
tbody tr:hover td{background:var(--soft)}
tbody tr:last-child td{border-bottom:0}
tfoot td{border-top:2px solid var(--line);font-weight:800;background:var(--card)}
/* Ringkasan MTT = tabel Summary (s26) workspace */
.mtt-t{border:1px solid var(--line);border-radius:12px;border-collapse:separate;border-spacing:0;overflow:hidden}
.mtt-t thead th{background:#182338;color:#fff;border-bottom:0}
.mtt-t td{vertical-align:middle;padding-top:0;padding-bottom:0;height:40px;background:var(--card)}
.mtt-t tbody tr{cursor:pointer}
.mtt-t tbody tr:nth-child(even) td{background:var(--soft)}
.mtt-t tbody tr:hover td{background:var(--or4)}
.mtt-t tr.sel td{background:var(--ink)!important;color:var(--card);font-weight:800}
.mtt-t tr.sel .pbar .t{background:rgba(128,128,140,.35)}
.mtt-t tr.fut td{color:var(--faint)}
.pbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.pbar .t{width:60px;height:7px;background:var(--soft);border-radius:4px;overflow:hidden}
.mtt-t tbody tr:nth-child(even) .pbar .t{background:var(--line)}
.pbar .t span{display:block;height:100%;background:var(--or);border-radius:4px}

/* ---------- kontrol segmen & chip (= .seg / .chips workspace) ---------- */
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--card)}
.seg button{border:0;background:transparent;padding:7px 11px;font-weight:700;font-size:11.5px;color:var(--mut);min-height:34px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--soft);border-radius:6px;padding:4px 10px;font-size:11.5px;font-weight:700;color:var(--mut);min-height:30px}
.chip:hover{background:var(--card);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--or);border-color:var(--or);color:#fff}

/* ---------- grafik per wilayah ---------- */
.rg{flex:1;display:grid;grid-template-columns:minmax(78px,.8fr) repeat(4,minmax(0,1fr));column-gap:14px;align-content:stretch}
.rg>.h{font-size:12px;font-weight:700;color:var(--ink);padding:0 0 8px;border-bottom:2px solid var(--line);align-self:end}
.rg>.c{display:flex;flex-direction:column;justify-content:center;gap:4px;border-bottom:1px solid var(--line);padding:6px 0;min-height:40px}
.rg>.c.last{border-bottom:0}
.rg .code{align-self:flex-start}
.rg .t{height:8px;border-radius:6px;background:var(--soft);overflow:hidden}
.rg .t span{display:block;height:100%;border-radius:6px}
.rg .t .ok{background:var(--ink)}.rg .t .no{background:var(--or)}
.rg .v{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--mut);white-space:nowrap}
.rg .v b{font-size:12.5px;color:var(--ink);font-weight:800}
.rg .v b.ok{color:var(--ink)}
.rg .tot .t{height:10px}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center;font-size:10.5px;color:var(--mut);margin-top:12px}

/* ---------- kartu indikator ---------- */
.ind-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.ind{padding:18px;display:flex;flex-direction:column;gap:12px}
.ind-h{display:flex;gap:10px;align-items:center;justify-content:space-between}
.code{flex:none;font-size:12.5px;font-weight:800;color:var(--ink);white-space:nowrap}
.ind-n{font-size:12.5px;line-height:1.5;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;min-height:56px}
.ind-n.open{-webkit-line-clamp:unset}
.ind-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px;background:var(--soft);border-radius:8px}
.mini .k{font-size:11px;font-weight:700;color:var(--mut)}
.mini .v{font-size:22px;font-weight:800;letter-spacing:-.5px}
/* pill status = .pill workspace: sesuai jalur = tinta, perlu perhatian = oranye muda, tertinggal = oranye */
.badge,.st{border-radius:4px;font-size:10.5px;font-weight:800;padding:2px 7px;letter-spacing:.2px;white-space:nowrap;border:1px solid transparent}
.b-ok{background:var(--ink);color:var(--card)}
.b-warn{background:var(--warn-soft);color:var(--warn-ink);border-color:rgba(255,138,92,.35)}
.b-bad{background:var(--or4);color:var(--or);border-color:var(--or3)}
.b-mute{background:var(--soft);color:var(--ink);border-color:var(--line)}
.viz{display:flex;flex-direction:column;gap:12px;margin-top:auto}
.viz .k{font-size:11px;font-weight:700;color:var(--mut);margin-bottom:5px;display:flex;justify-content:space-between;gap:8px}
.viz .k b{color:var(--ink);font-weight:800;font-size:12px}
.sexbar{display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--line)}
.sexbar .m{background:var(--male)}.sexbar .f{background:var(--female)}
.lbl{display:flex;justify-content:space-between;font-size:11px;color:var(--mut);margin-top:5px}
.lbl b{color:var(--ink);font-weight:800}
.annbar{height:12px;border-radius:6px;background:var(--soft);overflow:hidden}
.annbar span{display:block;height:100%;background:var(--or);border-radius:6px}
.nodata{font-size:11px;color:var(--faint);height:7px;display:flex;align-items:center}

/* ---------- kelompok sasaran ---------- */
.grps{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.grp{display:grid;grid-template-columns:140px 1fr 150px;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:12.5px;font-weight:700}
.grp:last-child{border-bottom:0}
.grp .t{height:12px;background:var(--soft);border-radius:6px;overflow:hidden}
.grp .t span{display:block;height:100%;background:var(--or);border-radius:6px}
.grp .v{text-align:right;color:var(--mut);font-size:11.5px;font-weight:500}
.grp .v b{color:var(--ink);font-size:14px;font-weight:800}


/* ---------- tabel indikator yang ditargetkan (minimalis) ---------- */
.ind-t{table-layout:fixed}
.ind-t col.c-ind{width:auto}.ind-t col.c-n{width:96px}.ind-t col.c-sx{width:150px}.ind-t col.c-an{width:170px}.ind-t col.c-st{width:142px}
.ind-t th{font-size:11.5px}
.ind-t td{vertical-align:middle;padding-top:12px;padding-bottom:12px}
.ind-t td.lead{padding-right:20px}
.ind-t .code{display:block;margin-bottom:2px}
.ind-t .ind-n{font-weight:500;min-height:0;-webkit-line-clamp:2;font-size:12px;color:var(--mut)}
.ind-t td.r{font-size:13px}
.ind-t td.r b{font-size:14px;font-weight:800}
.sx-mini .lbl,.an-mini .lbl{margin-top:5px;font-size:11px}
.an-mini .annbar{height:7px;border-radius:4px}
.an-mini .lbl b{font-size:11.5px}
.dash{font-size:11px;color:var(--faint);font-weight:600}
/* ---------- filter bulan anggaran ---------- */
.fbar{flex-direction:row;align-items:center;justify-content:space-between;gap:12px 18px;padding:12px 16px;flex-wrap:wrap}
.fb-l{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
.fb-lab{font-size:11px;font-weight:700;color:var(--mut)}
.mseg{display:grid;grid-template-columns:repeat(12,minmax(44px,1fr));border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:1;min-width:0}
.mseg button{border:0;border-left:1px solid var(--line);background:var(--card);height:36px;font-size:11.5px;font-weight:700;color:var(--mut);padding:0}
.mseg button:first-child{border-left:0}
.mseg button:hover:not(:disabled){background:var(--soft);color:var(--ink)}
.mseg button.ytd{background:var(--or4);color:var(--or)}
.mseg button[aria-pressed="true"],.mseg button[aria-pressed="true"]:hover{background:var(--ink);color:var(--card)}
.mseg button:disabled{color:var(--line2);cursor:default}
.fb-r{display:flex;align-items:center;gap:8px}
.fb-r b{font-size:13px;font-weight:800;min-width:40px;text-align:center}
.arr.sm{width:32px;height:32px;font-size:16px}

/* ---------- grafik ---------- */
svg text{font-family:inherit}
.chart{width:100%;height:auto;display:block}
.chart-wrap{flex:1;display:flex;align-items:center}

/* ---------- carousel ---------- */
.car-vp{overflow:hidden;border-radius:12px}
.car-tr{display:flex;transition:transform .35s ease}
.slide{flex:0 0 100%;display:grid;grid-template-columns:3fr 2fr;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;min-height:400px}
.ph-img{background:var(--soft);display:grid;place-items:center;min-height:300px;position:relative}
.ph-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ph-empty{text-align:center;color:var(--faint);font-size:12px;font-weight:600}
.ph-empty svg{display:block;margin:0 auto 8px}
.slide-b{padding:28px;display:flex;flex-direction:column;gap:10px;border-top:3px solid var(--or)}
.slide-b h3{margin:0;font-size:22px;line-height:1.25;letter-spacing:-.4px;font-weight:800}
.slide-b .m{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--mut);font-weight:600}
.slide-b p{margin:4px 0 0;font-size:14px;max-width:60ch;color:var(--ink2)}
.slide-b .code{background:var(--or4);color:var(--or);border:1px solid var(--or3);border-radius:4px;padding:2px 7px;font-size:10.5px}
.car-nav{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:12px}
.dots{display:flex;gap:6px}
.dots button{width:8px;height:8px;border-radius:4px;border:0;background:var(--line2);padding:0;transition:width .2s}
.dots button[aria-current="true"]{background:var(--or);width:24px}
.arrows{display:flex;gap:8px;align-items:center}
.arrows .cnt{font-size:12px;font-weight:700;color:var(--mut);min-width:44px;text-align:center}
.arr{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;font-size:18px;color:var(--ink)}
.arr:hover{background:var(--soft)}
.arr:disabled{opacity:.35;cursor:default}

/* ---------- lain-lain ---------- */
.empty{padding:36px 20px;text-align:center;color:var(--mut);font-size:13px;margin:auto}
.empty b{display:block;color:var(--ink);font-size:14px;margin-bottom:4px}
.empty code{background:var(--soft);padding:1px 6px;border-radius:4px;font-size:12px}
details.note{margin-top:16px}
details.note summary{display:inline-flex;align-items:center;gap:8px;cursor:pointer;list-style:none;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:6px;padding:6px 12px;font-size:12px;font-weight:700}
details.note summary::-webkit-details-marker{display:none}
details.note summary::before{content:"!";display:inline-grid;place-items:center;width:15px;height:15px;border-radius:50%;background:var(--or);color:#fff;font-size:10px;font-weight:900}
details.note[open] summary{border-color:var(--or);color:var(--ink)}
details.note ul{margin:10px 0 0;padding:14px 16px 14px 32px;font-size:12.5px;color:var(--mut);background:var(--soft);border-left:3px solid var(--or);border-radius:7px}
details.note li{margin:4px 0}
.next-strip{display:flex;flex-wrap:wrap;gap:10px}
.nt{border-radius:8px;padding:10px 14px;background:var(--soft);font-size:11px;font-weight:700;color:var(--mut);min-width:96px}
.nt b{display:block;font-size:22px;font-weight:800;letter-spacing:-.5px;color:var(--ink)}
.tag{font-size:10.5px;color:var(--mut);white-space:nowrap;font-weight:600}

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fN=(v,d)=>v==null?'–':Number(v).toLocaleString('id-ID',{maximumFractionDigits:d??(Math.abs(v-Math.round(v))>1e-9?1:0)});
const fP=(v,d=0)=>v==null?'–':(v*100).toLocaleString('id-ID',{maximumFractionDigits:d})+'%';
const key=(y,m)=>`${y}-${String(m+1).padStart(2,'0')}`;
const parse=k=>{const [y,m]=k.split('-').map(Number);return {y,m:m-1}};
const lbl=k=>{const p=parse(k);return `${BULAN[p.m]} ${p.y}`};
const shift=(k,n)=>{const p=parse(k);const d=new Date(p.y,p.m+n,1);return key(d.getFullYear(),d.getMonth())};
const rp=v=>{if(v==null)return'–';const a=Math.abs(v);
  if(a>=1e9)return 'Rp '+(v/1e9).toLocaleString('id-ID',{maximumFractionDigits:2})+' M';
  if(a>=1e5)return 'Rp '+(v/1e6).toLocaleString('id-ID',{maximumFractionDigits:a<1e7?1:0})+' jt';
  return 'Rp '+v.toLocaleString('id-ID')};

function lastDataMonth(){ // latest month with any achievement
  let best=null;

}

function scopeInfo(m){
  const s=ST.scope;
  if(s==='bulan') return {k:'m'+m,lab:`${BULAN[m]}`,pick:d=>d.m[m]};
  if(s==='semester'){const j=m<6?0:1;return {k:'s'+j,lab:`Semester ${j+1}`,pick:d=>d.sem[j]}}
  return {k:'a',lab:'Tahunan',pick:d=>d.annual};
}
function regionChart(y,m,inds){
  const seg=`<div class="seg" role="group" aria-label="Periode grafik">${[['bulan','Bulan'],['semester','Semester'],['tahunan','Tahunan']].map(([k,t])=>`<button data-scope="${k}" aria-pressed="${ST.scope===k}">${t}</button>`).join('')}</div>`;
  const head=(meta)=>`<div class="panel-h"><h3>Capaian per wilayah</h3>${seg}</div>`;
  const RT=REGION&&REGION.target[y], RA=(REGION&&REGION.ach[y])||{};
  if(!RT) return `<div class="panel">${head()}<div class="panel-b"><div class="empty"><b>Target per wilayah belum tersedia untuk ${y}.</b>Isi sheet Target_Wilayah dan Capaian_Wilayah untuk tahun ${y}.</div></div></div>`;
  const sc=scopeInfo(m);
  const list=inds.filter(d=>(sc.pick(d)[0]||0)>0);
  if(!list.length) return `<div class="panel">${head()}<div class="panel-b"><div class="empty"><b>Tidak ada indikator yang ditargetkan.</b>Pilih periode lain.</div></div></div>`;
  const cell=(ach,tgt,isP,tot)=>{const p=tgt?ach/tgt:0;const ok=p>0.9;
    return `<div class="c${tot?' tot':''}"><div class="t"><span class="${ok?'ok':'no'}" style="width:${Math.min(p*100,100)}%"></span></div>
      <div class="v"><b class="num${ok?' ok':''}">${fP(p)}</b><span class="num">${fN(Math.round(ach))}/${fN(tgt<10?Math.round(tgt*10)/10:Math.round(tgt))}</span></div></div>`};
  let g=`<div class="h">Indikator</div>${REGION.kab.map(k=>`<div class="h">${k}</div>`).join('')}<div class="h tot">Total</div>`;
  list.forEach((d,ri)=>{
    const isP=isPct(d); const src=isP&&d.sub&&d.sub.num?d.sub.num:d;
    const v=sc.pick(src); const T=v[0]||0, A=v[3]||0;
    const sh=RT[d.code]||REGION.kab.map(()=>0); const sum=sh.reduce((a,b)=>a+b,0)||1;
    const ach=(RA[d.code]||{})[sc.k]||REGION.kab.map(()=>0);
    const last=ri===list.length-1?' last':'';
    g+=`<div class="c${last}" title="${esc(d.name)}"><span class="code">${esc(d.code.replace('IOP ',''))}</span></div>`;
    g+=sh.map((s,i)=>cell(ach[i],T*s/sum,isP).replace('class="c','class="c'+last)).join('');
    g+=cell(A,T,isP,true).replace('class="c','class="c'+last);
  });
  return `<div class="panel">${head()}<div class="panel-b"><div class="rg">${g}</div>
    <div class="legend"><span><span class="sw" style="background:var(--ink)"></span>Tercapai (&gt;90%)</span><span><span class="sw" style="background:var(--or)"></span>Belum tercapai</span><span>${sc.lab} ${y}, capaian/target</span>${FLAGS.contoh_wilayah?srcTag('sample','Rincian wilayah: data contoh'):srcTag('','Sumber: capaian per kabupaten')}</div></div></div>`;
}

/* ================= 2. CAPAIAN ================= */
const GRUP=[['remaja','Remaja putri'],['bumil','Ibu hamil'],['baduta','Baduta (0–23 bln)'],['balita','Balita (24–59 bln)']];
function sumReach(per){
  const d=SAMPLE.reach[per]; if(!d) return null;
  const kabs=ST.kab==='Semua'?Object.keys(d):[ST.kab];
  const o={remaja:0,bumil:0,badutaL:0,badutaP:0,balitaL:0,balitaP:0};
  kabs.forEach(k=>{for(const g in o)o[g]+=d[k][g]});
  o.baduta=o.badutaL+o.badutaP;o.balita=o.balitaL+o.balitaP;o.total=o.remaja+o.bumil+o.baduta+o.balita;return o;
}
function sumTarget(){
  const kabs=ST.kab==='Semua'?Object.keys(SAMPLE.target):[ST.kab];
  const o={remaja:0,bumil:0,baduta:0,balita:0};kabs.forEach(k=>{for(const g in o)o[g]+=SAMPLE.target[k][g]});
  o.total=o.remaja+o.bumil+o.baduta+o.balita;return o;
}
function renderCapaian(){

  const T=sumTarget();
  const sexCard=(lab,L,P,t)=>`<div class="panel kpi"><div class="lab">${lab}</div><div class="val num">${fN(L+P)} <small>/ ${fN(t)}</small></div>
     <div class="sexbar" style="margin:8px 0 6px"><span class="m" style="width:${(L/(L+P||1))*100}%"></span><span class="f" style="width:${(P/(L+P||1))*100}%"></span></div>
     <div class="split"><span><span class="sw" style="background:var(--male)"></span>Laki-laki <b class="num">${fN(L)}</b></span><span><span class="sw" style="background:var(--female)"></span>Perempuan <b class="num">${fN(P)}</b></span></div></div>`;
  const grp=GRUP.map(([g,n])=>{const v=r[g],t=T[g],p=t?v/t:0;return `<div class="grp"><div>${n}</div><div class="t"><span style="width:${Math.min(p*100,100)}%"></span></div><div class="v num"><b>${fN(v)}</b> / ${fN(t)} (${fP(p)})</div></div>`}).join('');
  // progress series: same year, months <= per
  const {y,m}=parse(ST.per); const ser=[];

    ${sexCard('Baduta (0–23 bulan)',r.badutaL,r.badutaP,T.baduta)}

  <div class="row r-11">

    <div class="panel"><div class="panel-h"><h3>Per kelompok sasaran</h3><span class="meta">Dijangkau / populasi sasaran</span></div><div class="panel-b"><div class="grps">${grp}</div></div></div>

  </div>
  ${noteBlock('capaian','Catatan data capaian')}`;

/* ---------- line chart (cumulative vs reference) ---------- */
function lineChart(ser,ref,refLab,opt={}){
  const W=SM()?360:(opt.W||560),H=SM()?230:(opt.H||240),L=opt.axis?(SM()?72:68):(SM()?54:50),R=SM()?12:20,Tp=18,B=28; const n=opt.n||12; const labels=opt.labels||BLN;
  const vals=ser.filter(v=>v!=null); const plan=opt.plan||null;
  const max=Math.max(ref||0,...vals,...(plan||[0]))*1.05||1;
  const x=i=>L+(W-L-R)*(i/(n-1)); const yy=v=>Tp+(H-Tp-B)*(1-v/max);
  const fmt=opt.fmt||(v=>fN(v));
  let g='';
  [0,.5,1].forEach(f=>{const v=max/1.05*f;g+=`<line x1="${L}" x2="${W-R}" y1="${yy(v)}" y2="${yy(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${yy(v)+4}" text-anchor="end" font-size="11" fill="var(--faint)">${opt.axis?opt.axis(v):fN(Math.round(v))}</text>`});
  labels.forEach((l,i)=>{if(i<n&&(n<=12)) g+=`<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--faint)">${l}</text>`});
  if(ref&&!plan){g+=`<line x1="${L}" x2="${W-R}" y1="${yy(ref)}" y2="${yy(ref)}" stroke="var(--ink)" stroke-dasharray="4 4"/><text x="${W-R}" y="${yy(ref)-6}" text-anchor="end" font-size="11" font-weight="600" fill="var(--mut)">${refLab} ${fmt(ref)}</text>`}
  if(plan){const pts=plan.map((v,i)=>`${x(i)},${yy(v)}`).join(' ');g+=`<polyline points="${pts}" fill="none" stroke="var(--ink)" stroke-width="1.5" stroke-dasharray="4 4"/><text x="${x(n-1)}" y="${yy(plan[n-1])-8}" text-anchor="end" font-size="11" font-weight="600" fill="var(--mut)">${refLab}</text>`}
  const pts=ser.map((v,i)=>v==null?null:[x(i),yy(v)]).filter(Boolean);
  if(pts.length){
    g+=`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--or)" stroke-width="2.5" stroke-linejoin="round"/>`;
    pts.forEach(p=>g+=`<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="var(--or)" stroke="var(--card)" stroke-width="1.5"/>`);
    const lp=pts[pts.length-1], lv=vals[vals.length-1];
    g+=`<text x="${lp[0]}" y="${lp[1]-10}" text-anchor="${lp[0]>W-90?'end':'middle'}" font-size="12.5" font-weight="800" fill="var(--ink)">${fmt(lv)}</text>`;
  }
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Grafik progres">${g}</svg>`;
}

/* ================= 3. ANGGARAN ================= */
function fyOf(k){const p=parse(k);return (p.m+1)>=ANGGARAN_CFG.fyStartMonth?p.y+1:p.y}
function fyMonths(fy){const s=ANGGARAN_CFG.fyStartMonth;const a=[];for(let i=0;i<12;i++){const d=new Date(fy-1,s-1+i,1);a.push(key(d.getFullYear(),d.getMonth()))}return a}
function renderAnggaran(){
  const fy=fyOf(ST.per);
  const head=`<div class="ph"><div><h2>Anggaran dan burn rate</h2><div class="sub">FY${String(fy).slice(2)} (${lbl(fyMonths(fy)[0])} – ${lbl(fyMonths(fy)[11])}), realisasi sampai ${lbl(ST.per)}</div></div>${FLAGS.contoh_anggaran?srcTag('sample','Data contoh, ganti dengan laporan keuangan'):srcTag('','Sumber: laporan keuangan')}</div>`;
  const fbar=budgetFilter(fy);
  const pos=SAMPLE.budget.filter(b=>b.fy===fy);
  if(!pos.length) return head+fbar+`<div class="panel"><div class="empty"><b>Belum ada data anggaran FY${String(fy).slice(2)}.</b>Isi sheet Anggaran dengan fy = ${fy}.</div></div>`;
  const ms=fyMonths(fy); const upto=ms.indexOf(ST.per); const ytdMs=ms.slice(0,upto+1);
  const lines=pos.map(b=>{const ytd=ytdMs.reduce((a,k)=>a+(b.realisasi[k]||0),0);const p=b.anggaran?ytd/b.anggaran:0;
    return {...b,ytd,p,sisa:b.anggaran-ytd,st:p>=0.9?'Terserap':p>0?'Sebagian':'Belum terserap'}});
  const A=lines.reduce((a,b)=>a+b.anggaran,0), Y=lines.reduce((a,b)=>a+b.ytd,0);
  const br=Y/A, exp=(upto+1)/12;
  const cum=[];let c=0;ms.forEach((k,i)=>{c+=pos.reduce((a,b)=>a+(b.realisasi[k]||0),0);cum.push(i<=upto?c:null)});
  const plan=ms.map((k,i)=>A*(i+1)/12);
  const cnt={Semua:lines.length,Terserap:0,Sebagian:0,'Belum terserap':0};lines.forEach(l=>cnt[l.st]++);
  const show=lines.filter(l=>ST.bud==='Semua'||l.st===ST.bud);
  const stc={Terserap:'b-ok',Sebagian:'b-warn','Belum terserap':'b-bad'};
  const rows=show.map(l=>`<tr><td class="num hide-sm">${esc(l.kode)}</td><td class="lead"><span class="tag" style="font-size:12px">${SM()?esc(l.kode)+' ':''}</span>${esc(l.nama)}</td><td class="r num" data-l="Anggaran tahunan">${rp(l.anggaran)}</td><td class="r num" data-l="Realisasi YTD">${rp(l.ytd)}</td><td class="r num" data-l="Serapan"><div class="pbar"><span>${fP(l.p)}</span><div class="t hide-sm"><span style="width:${Math.min(l.p*100,100)}%"></span></div></div></td><td class="r num" data-l="Sisa">${rp(l.sisa)}</td><td data-l="Status"><span class="st ${stc[l.st]}">${l.st}</span></td></tr>`).join('');
  const sA=show.reduce((a,b)=>a+b.anggaran,0),sY=show.reduce((a,b)=>a+b.ytd,0);
  const gapPts=Math.round((br-exp)*100);

/* =====================================================================
   SUMBER DATA: GOOGLE SHEET
   - SHEET_ID diisi di bagian KONFIGURASI (atas file) atau lewat ?sheet=<ID>.
   - Spreadsheet harus dibagikan "Siapa saja yang memiliki link: Pelihat".
   - Bila gagal dimuat, dashboard tetap memakai data bawaan di file ini.
   ===================================================================== */
const SHEETS_REQUIRED=['Pengaturan','MTT_Indikator','MTT_Data','MTT_Ringkasan'];
const SHEETS_OPTIONAL=['Target_Wilayah','Capaian_Wilayah','Populasi_Sasaran','Jangkauan','Kegiatan','Anggaran','Highlight','Tantangan','Rencana','Catatan'];
const EMBEDDED=JSON.parse(JSON.stringify({MTT,REGION,SAMPLE,KONTEN,NOTES,FLAGS,ANGGARAN_CFG}));
const DATA_STATE={src:'embedded',at:null,warn:[]};

function sheetId(){const q=new URLSearchParams(location.search).get('sheet');return (q||SHEET_ID||'').trim()}
function gvizUrl(id,name){return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(id)}/gviz/tq?tqx=out:csv&headers=1&sheet=${encodeURIComponent(name)}&t=${Date.now()}`}

/* CSV parser (tanda kutip, koma, dan baris baru di dalam sel) */
function parseCSV(txt){
  const rows=[];let row=[],f='',q=false;
  for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  if(!rows.length)return [];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).filter(r=>r.some(v=>v.trim()!=='')).map(r=>{const o={};head.forEach((h,i)=>{if(h)o[h]=(r[i]??'').trim()});return o});
}
/* angka: kosong -> null; menerima titik atau koma desimal, tanda %, spasi */
function num(v){
  if(v==null)return null;let s=String(v).replace(/[\s\u00a0]/g,'');if(s===''||s==='-'||s==='–')return null;
  let pct=false;if(s.endsWith('%')){pct=true;s=s.slice(0,-1)}
  if(s.includes('.')&&s.includes(',')){if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');else s=s.replace(/,/g,'')}
  else if(s.includes(','))s=s.replace(',','.');
  const n=Number(s);if(!isFinite(n))return null;return pct?n/100:n;
}
/* periode: '2026-09', '2026-9', '2026-09-01', '9/1/2026' -> '2026-09' */
function per(v){
  const s=String(v||'').trim();let m=s.match(/^(\d{4})[-/.](\d{1,2})/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);if(m)return `${m[3]}-${m[1].padStart(2,'0')}`;
  return s;
}
const yes=v=>/^(ya|yes|y|true|1)$/i.test(String(v||'').trim());
const byOrder=(a,b)=>(num(a.urutan)??0)-(num(b.urutan)??0);
function group(rows,k){const o={};rows.forEach(r=>{(o[r[k]]=o[r[k]]||[]).push(r)});return o}

/* ---- ubah isi sheet menjadi struktur yang dipakai dashboard ---- */
function buildFromSheets(S){
  const cfg={};(S.Pengaturan||[]).forEach(r=>cfg[r.kunci]=r.nilai);
  const out={FLAGS:{},ANGGARAN_CFG:{...ANGGARAN_CFG}};
  ['contoh_wilayah','contoh_jangkauan','contoh_anggaran','contoh_highlight','draf_tantangan','draf_rencana'].forEach(k=>out.FLAGS[k]=k in cfg?yes(cfg[k]):EMBEDDED.FLAGS[k]);
  if(num(cfg.fy_mulai_bulan))out.ANGGARAN_CFG.fyStartMonth=num(cfg.fy_mulai_bulan);

  /* MTT */
  const empty=()=>[null,null,null,null,null];
  const vals=r=>[num(r.target),num(r.laki_laki),num(r.perempuan),num(r.total),num(r.persen_capaian)];
  const slot=()=>({m:Array.from({length:12},empty),sem:[empty(),empty()],annual:empty()});
  const years={};
  S.MTT_Indikator.slice().sort(byOrder).forEach(r=>{const y=num(r.tahun);if(!y)return;
    (years[y]=years[y]||[]).push({code:r.kode,name:r.nama_indikator,agg:r.agregasi,fmt:r.format,unit:r.satuan,...slot(),sub:{}})});
  S.MTT_Data.forEach(r=>{const y=num(r.tahun);const d=(years[y]||[]).find(x=>x.code===r.kode);if(!d)return;
    let t=d;if(/^pembilang$/i.test(r.baris))t=d.sub.num=d.sub.num||slot();else if(/^penyebut$/i.test(r.baris))t=d.sub.den=d.sub.den||slot();
    const p=String(r.periode||'').toUpperCase().trim();const v=vals(r);
    if(/^M\d{1,2}$/.test(p))t.m[+p.slice(1)-1]=v;else if(p==='S1')t.sem[0]=v;else if(p==='S2')t.sem[1]=v;else if(p==='TAHUN')t.annual=v});
  const summary={};Object.keys(years).forEach(y=>summary[y]=Array.from({length:12},()=>[0,0,0]));
  S.MTT_Ringkasan.forEach(r=>{const y=num(r.tahun),b=num(r.bulan);if(summary[y]&&b>=1&&b<=12)summary[y][b-1]=[num(r.ditargetkan)||0,num(r.tercapai)||0,num(r.persen)||0]});
  out.MTT={years,summary};

  /* wilayah */
  if(S.Target_Wilayah){
    const fixed=['tahun','kode','total'];const kab=Object.keys(S.Target_Wilayah[0]||{}).filter(h=>!fixed.includes(h));
    const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
    const R={kab:kab.map(cap),target:{},ach:{}};
    S.Target_Wilayah.forEach(r=>{const y=num(r.tahun);if(!y)return;(R.target[y]=R.target[y]||{})[r.kode]=kab.map(k=>num(r[k])||0)});
    const PK=p=>{p=String(p||'').toUpperCase();if(/^M\d{1,2}$/.test(p))return 'm'+(+p.slice(1)-1);return {S1:'s0',S2:'s1',TAHUN:'a'}[p]};
    (S.Capaian_Wilayah||[]).forEach(r=>{const y=num(r.tahun),k=PK(r.periode);if(!y||!k)return;
      const A=(R.ach[y]=R.ach[y]||{});(A[r.kode]=A[r.kode]||{})[k]=kab.map(x=>num(r[x])||0)});
    out.REGION=R;
  }
  /* jangkauan dan kegiatan */
  const SM={...EMBEDDED.SAMPLE};
  if(S.Populasi_Sasaran){SM.target={};S.Populasi_Sasaran.forEach(r=>SM.target[r.kabupaten]={remaja:num(r.remaja_putri)||0,bumil:num(r.ibu_hamil)||0,baduta:num(r.baduta)||0,balita:num(r.balita)||0})}
  if(S.Jangkauan){SM.reach={};S.Jangkauan.forEach(r=>{const p=per(r.periode);(SM.reach[p]=SM.reach[p]||{})[r.kabupaten]={remaja:num(r.remaja_putri)||0,bumil:num(r.ibu_hamil)||0,badutaL:num(r.baduta_laki)||0,badutaP:num(r.baduta_perempuan)||0,balitaL:num(r.balita_laki)||0,balitaP:num(r.balita_perempuan)||0}})}
  if(S.Kegiatan){SM.kegiatan={};const g=group(S.Kegiatan.map(r=>({...r,periode:per(r.periode)})),'periode');
    for(const p in g)SM.kegiatan[p]=g[p].sort(byOrder).map(r=>({nama:r.nama_kegiatan,kode:r.kode_aktivitas,tgl:r.tanggal,kab:r.kabupaten,L:num(r.laki_laki)||0,P:num(r.perempuan)||0}))}
  if(S.Anggaran){const sm=out.ANGGARAN_CFG.fyStartMonth;
    SM.budget=S.Anggaran.filter(r=>num(r.fy)).map(r=>{const fy=num(r.fy);const ms=[];for(let i=0;i<12;i++){const d=new Date(fy-1,sm-1+i,1);ms.push(key(d.getFullYear(),d.getMonth()))}
      const real={};Object.keys(r).forEach(h=>{const m=h.match(/^m(\d{2})/);if(m){const v=num(r[h]);if(v!=null)real[ms[+m[1]-1]]=v}});
      return {fy,kode:r.kode,nama:r.aktivitas,anggaran:num(r.anggaran_tahunan)||0,realisasi:real}})}
  out.SAMPLE=SM;

  /* konten bulanan */
  const KN={...EMBEDDED.KONTEN};
  const per_group=(rows,pk,map)=>{const o={};const g=group(rows.map(r=>({...r,_p:per(r[pk])})),'_p');for(const p in g)o[p]=g[p].sort(byOrder).map(map);return o};
  if(S.Highlight)KN.highlight=per_group(S.Highlight,'periode',r=>({judul:r.judul,tanggal:r.tanggal,lokasi:r.lokasi,kode:r.kode_aktivitas,ket:r.keterangan,foto:r.foto_url||''}));
  if(S.Tantangan)KN.tantangan=per_group(S.Tantangan,'periode',r=>({tantangan:r.tantangan,dukungan:r.dukungan,pendukung:r.pendukung,sumber:r.sumber==='baru'?'':(r.sumber||'')}));
  if(S.Rencana)KN.rencana=per_group(S.Rencana,'periode_rencana',r=>({kegiatan:r.kegiatan,waktu:r.waktu,lokasi:r.lokasi,pic:r.pic,ket:r.hasil,sumber:r.sumber==='baru'?'':(r.sumber||'')}));
  out.KONTEN=KN;
  if(S.Catatan){const N={mtt:[],capaian:[],anggaran:[]};S.Catatan.slice().sort(byOrder).forEach(r=>{const h=String(r.halaman||'').toLowerCase();if(N[h]&&r.catatan)N[h].push(r.catatan)});out.NOTES=N}
  return out;
}

async function loadSheet(){
  const id=sheetId();setDataBadge();
  if(!id)return;
  DATA_STATE.src='loading';setDataBadge();
  const fetchOne=async n=>{const r=await fetch(gvizUrl(id,n),{cache:'no-store'});if(!r.ok)throw new Error(n+': HTTP '+r.status);
    const t=await r.text();if(/^\s*</.test(t))throw new Error(n+': bukan CSV (cek akses berbagi)');return parseCSV(t)};
  try{
    const S={};
    await Promise.all(SHEETS_REQUIRED.map(async n=>{S[n]=await fetchOne(n)}));
    await Promise.all(SHEETS_OPTIONAL.map(async n=>{try{const rows=await fetchOne(n);if(rows.length)S[n]=rows}catch(e){DATA_STATE.warn.push(e.message)}}));
    if(!S.MTT_Indikator.length||!S.MTT_Data.length)throw new Error('Sheet MTT kosong');
    const D=buildFromSheets(S);
    ({MTT,SAMPLE,KONTEN,FLAGS,ANGGARAN_CFG}=D);if(D.REGION)REGION=D.REGION;if(D.NOTES)NOTES=D.NOTES;
    DATA_STATE.src='sheet';DATA_STATE.at=new Date();
    setupPeriods(false);render();
  }catch(e){
    console.warn('Gagal memuat Google Sheet:',e);DATA_STATE.src='error';DATA_STATE.warn.push(String(e.message||e));
  }
  setDataBadge();
}
function setDataBadge(){
  const el=$('#dataSrc');if(!el)return;
  const t=DATA_STATE.at?DATA_STATE.at.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}):'';
  const map={embedded:['','Data bawaan'],loading:['draft','Memuat Google Sheet…'],sheet:['','Data: Google Sheet, dimuat '+t],error:['sample','Google Sheet gagal dimuat, memakai data bawaan']};
  const [c,txt]=map[DATA_STATE.src];el.className='src '+c;el.innerHTML='<i></i>'+txt;
  el.title=DATA_STATE.warn.join('\n');
}
/* daftar bulan di pilihan header mengikuti tahun yang ada di MTT */
function setupPeriods(first){
  LAST=lastDataMonth();
  const ks=[];Object.keys(MTT.years).sort().forEach(y=>{for(let i=0;i<12;i++)ks.push(key(+y,i))});
  PERIODS=ks;
  $('#per').innerHTML=ks.slice().reverse().map(k=>`<option value="${k}">${lbl(k)}</option>`).join('');
  if(first||!ks.includes(ST.per))ST.per=LAST||ks[ks.length-1];
  $('#per').value=ST.per;
}

/* ================= shell ================= */
const R={penutup:renderPenutup,cover:renderCover,mtt:renderMTT,capaian:renderCapaian,anggaran:renderAnggaran,highlight:renderHighlight,tantangan:renderTantangan,rencana:renderRencana};
function render(){
  $('#tabs').innerHTML=SECTIONS.map(s=>{const n=NUM(s.id);return `<button class="tab" role="tab" data-sec="${s.id}" aria-selected="${ST.sec===s.id}">${n?`<span class="n">${n}</span>`:''}${s.t}</button>`}).join('');
  $('#main').innerHTML=SECTIONS.map(s=>{let h=R[s.id]();const k=NUM(s.id);
    if(k>0)h=h.replace(/^<div class="ph"><div>([\s\S]*?<\/div>)<\/div>/,(m,inner)=>`<div class="ph pg-head"><div class="pg-l"><span class="pg-num">${String(k).padStart(2,'0')}</span><div>${inner}</div></div>`);
    const anim=ST.sec===s.id&&ST.anim?' anim-'+ST.anim:'';
    return `<section class="page ${ST.sec===s.id?'on':''}${anim}" id="p-${s.id}" role="tabpanel">${h}</section>`}).join('');
  ST.anim=null;
  const i=SECTIONS.findIndex(s=>s.id===ST.sec);
  const pv=$('#prev'),nx=$('#next');
  pv.disabled=i===0;nx.disabled=i===SECTIONS.length-1;
  pv.textContent=i>0?'‹ '+SECTIONS[i-1].t:'';nx.textContent=i<SECTIONS.length-1?SECTIONS[i+1].t+' ›':'';
  const fn=NUM(SECTIONS[i].id);$('#fsLab').textContent=`${fn?fn+'. ':''}${SECTIONS[i].t}  (${i+1}/${SECTIONS.length})`;
  $('#fsPrev').disabled=i===0;$('#fsNext').disabled=i===SECTIONS.length-1;
}
/* ---------- mode presentasi (layar penuh) ---------- */
function startPresent(){
  ST.sec='cover';document.body.classList.add('present');render();window.scrollTo({top:0});
  const el=document.documentElement;
  if(el.requestFullscreen&&!document.fullscreenElement) el.requestFullscreen().catch(()=>{});
}
function stopPresent(){document.body.classList.remove('present');if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});render()}
function setSec(id){
  const from=SECTIONS.findIndex(s=>s.id===ST.sec),to=SECTIONS.findIndex(s=>s.id===id);
  if(to===from)return;
  ST.anim=to>from?'next':'prev';
  ST.sec=id;render();window.scrollTo({top:0})}
function setPer(k){ST.per=k;ST.slide=0;$('#per').value=k;render()}

let LAST,PERIODS=[];
function setTheme(t){document.documentElement.dataset.theme=t;
  document.querySelectorAll('[data-theme-set]').forEach(b=>{const on=b.dataset.themeSet===t;b.classList.toggle('on',on);b.setAttribute('aria-pressed',on)})}
function init(){
  setTheme(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  document.querySelectorAll('[data-theme-set]').forEach(b=>b.onclick=()=>setTheme(b.dataset.themeSet));
  $('#present').onclick=startPresent;$('#fsExit').onclick=stopPresent;
  $('#fsPrev').onclick=()=>$('#prev').click();$('#fsNext').onclick=()=>$('#next').click();
  document.addEventListener('fullscreenchange',()=>{if(!document.fullscreenElement&&document.body.classList.contains('present')){document.body.classList.remove('present');render()}});
  setupPeriods(true);
  $('#per').addEventListener('change',e=>setPer(e.target.value));
  $('#prev').onclick=()=>{const i=SECTIONS.findIndex(s=>s.id===ST.sec);if(i>0)setSec(SECTIONS[i-1].id)};
  $('#next').onclick=()=>{const i=SECTIONS.findIndex(s=>s.id===ST.sec);if(i<SECTIONS.length-1)setSec(SECTIONS[i+1].id)};
  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-sec],[data-k],[data-kab],[data-bud],[data-sl],[data-mv],[data-scope],[data-fy],.ind-n');if(!t)return;
    if(t.disabled)return;
    if(t.dataset.sec)setSec(t.dataset.sec);
    else if(t.dataset.k)setPer(t.dataset.k);
    else if(t.dataset.fy){shiftFY(+t.dataset.fy)}
    else if(t.dataset.scope){ST.scope=t.dataset.scope;render()}
    else if(t.dataset.kab){ST.kab=t.dataset.kab;render()}
    else if(t.dataset.bud){ST.bud=t.dataset.bud;render()}
    else if(t.dataset.sl)goSlide(+t.dataset.sl);
    else if(t.dataset.mv)goSlide(ST.slide+ +t.dataset.mv);
    else if(t.classList.contains('ind-n'))t.classList.toggle('open');
  });
  document.addEventListener('keydown',e=>{
    if(e.target.matches('select,input,textarea'))return;
    if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.k){setPer(e.target.dataset.k);return}
    if(e.key==='Escape'&&document.body.classList.contains('present')){stopPresent();return}
    const fwd=['ArrowRight','PageDown'],back=['ArrowLeft','PageUp'];
    if(!fwd.includes(e.key)&&!back.includes(e.key))return;
    e.preventDefault();
    const d=fwd.includes(e.key)?1:-1;
    if(ST.sec==='highlight'&&(KONTEN.highlight[ST.per]||[]).length){const n=KONTEN.highlight[ST.per].length;const ni=ST.slide+d;if(ni>=0&&ni<n){goSlide(ni);return}}
    const i=SECTIONS.findIndex(s=>s.id===ST.sec)+d;if(i>=0&&i<SECTIONS.length)setSec(SECTIONS[i].id);
  });
  // swipe for carousel
  let sx=null;
  document.addEventListener('touchstart',e=>{if(e.target.closest('#car'))sx=e.touches[0].clientX},{passive:true});
  document.addEventListener('touchend',e=>{if(sx==null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;if(Math.abs(dx)>40)goSlide(ST.slide+(dx<0?1:-1))});
  let lastSm=SM();window.addEventListener('resize',()=>{if(SM()!==lastSm){lastSm=SM();render()}});
  render();
  loadSheet();
}
init();

</script>
</body>
