<!DOCTYPE html>
<html lang="id" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PASTI-Papua | Paparan Bulanan Zonal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/dashboard.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand">
      <span class="hb-badge" aria-hidden="true">P</span>
      <div class="ttl"><h1>PASTI-Papua <span>· Paparan bulanan</span></h1><p>Mimika · Nabire · Asmat <span id="dataSrc" class="src" style="margin-left:8px"></span></p></div>
    </div>
    <div class="ctrl">
      <div class="fxs"><label for="per">Bulan laporan</label><select id="per" class="sel"></select></div>
      <div class="tg" role="group" aria-label="Mode tampilan">
        <button data-theme-set="light" aria-label="Mode terang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
        <button data-theme-set="dark" aria-label="Mode gelap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button>
      </div>
      <button class="ibtn" onclick="window.print()" aria-label="Cetak"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M7 14h10v7H7z"/></svg></button>
      <button class="ibtn pri" id="present" aria-label="Mulai presentasi layar penuh"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Presentasi</span></button>
    </div>
  </div>
  <nav class="tabs" role="tablist" aria-label="Bagian paparan" id="tabs"></nav>
</header>

<main id="main"></main>
<div class="pager"><button id="prev"></button><button id="next"></button></div>
<div class="pbar-fs" id="pbar" aria-label="Kontrol presentasi">
  <button class="arr" id="fsPrev" aria-label="Bagian sebelumnya">‹</button>
  <span class="fs-lab" id="fsLab"></span>
  <button class="arr" id="fsNext" aria-label="Bagian berikutnya">›</button>
  <div class="tg" role="group" aria-label="Mode tampilan"><button data-theme-set="light" aria-label="Mode terang"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><button data-theme-set="dark" aria-label="Mode gelap"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg></button></div>
  <button class="ibtn" id="fsExit" aria-label="Keluar dari presentasi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>Keluar</button>
</div>

<script src="assets/data.js"></script>
<script src="assets/dashboard.js"></script>
</body>
</html>
